name: Build N60Pro Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/toolchain-*
            staging_dir/host
            build_dir/host
            build_dir/toolchain-*
          key: ${{ runner.os }}-toolchain-${{ hashFiles('include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-
      - name: Update feeds
        run: |
          sed -i 's|src-git packages https://git.openwrt.org/feed/packages.git|src-git packages https://github.com/immortalwrt/packages.git;openwrt-24.10|' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy config
        run: cp defconfig/netcore-n60-pro.config .config

      - name: Download packages
        run: make defconfig && make download -j8

      - name: Compile firmware
        run: make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: n60pro-firmware
          path: bin/targets/mediatek/filogic/*sysupgrade*
          retention-days: 7
